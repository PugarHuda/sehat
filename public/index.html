<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MedNest — Family Health, On-Device</title>
<style>
  :root {
    --bg: #0e1512; --panel: #16201b; --panel2: #1d2a23;
    --text: #e8f3ec; --dim: #8aa496; --accent: #34d399; --accent2: #0ea5e9;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 12px 16px; background: var(--panel);
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #243329;
  }
  header .logo { font-size: 22px; }
  header h1 { font-size: 17px; font-weight: 700; }
  header .badge {
    margin-left: auto; font-size: 11px; font-weight: 600;
    color: #052e1c; background: var(--accent);
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--accent2); color: #04222e; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: var(--panel2); border-bottom-left-radius: 4px; }
  .meta { align-self: flex-start; font-size: 11px; color: var(--dim); padding: 0 6px; }
  .src  { color: var(--accent); }
  form {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid #243329;
  }
  input {
    flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #2c3f33;
    background: var(--bg); color: var(--text); font-size: 16px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 0 18px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 700;
    background: var(--accent); color: #052e1c;
  }
  button:disabled { opacity: 0.5; }
  .hint { color: var(--dim); font-size: 13px; text-align: center; padding: 18px 24px; }
  .hint b { color: var(--text); }
</style>
</head>
<body>
<header>
  <span class="logo">🏠🩺</span>
  <h1>MedNest</h1>
  <span class="badge">100% on-device · no cloud</span>
</header>

<div id="chat">
  <div class="hint">
    Ask about your family's health records.<br />
    Answers come from <b>MedGemma running on the family PC</b> —
    nothing ever leaves your home network.<br /><br />
    Try: <b>"How has Budi's blood sugar changed over his last tests?"</b>
  </div>
</div>

<form id="f">
  <input id="q" placeholder="Ask about the family's health records…" autocomplete="off" />
  <button id="send">➤</button>
</form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("f");
  const input = document.getElementById("q");
  const send = document.getElementById("send");

  function add(cls, text) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }
  function addMeta(html) {
    const d = document.createElement("div");
    d.className = "meta";
    d.innerHTML = html;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    send.disabled = true;
    add("user", question);
    const bot = add("bot", "…");
    let text = "";
    const t0 = performance.now();

    const es = new EventSource("/api/ask?q=" + encodeURIComponent(question));
    es.addEventListener("token", (ev) => {
      text += JSON.parse(ev.data);
      bot.textContent = text;
      chat.scrollTop = chat.scrollHeight;
    });
    es.addEventListener("done", (ev) => {
      const { stats, sources } = JSON.parse(ev.data);
      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      const tps = stats.durationMs ? (stats.tokenCount / (stats.durationMs / 1000)).toFixed(1) : "?";
      addMeta(
        `⚡ TTFT ${stats.ttftMs} ms · ${tps} tok/s · ${secs}s total` +
        (sources.length ? ` · 📄 <span class="src">${sources.join(", ")}</span>` : "")
      );
      es.close();
      send.disabled = false;
      input.focus();
    });
    es.addEventListener("error", () => {
      if (text === "") bot.textContent = "⚠️ Connection error — is the MedNest server running?";
      es.close();
      send.disabled = false;
    });
  });
</script>
</body>
</html>
