# ============================================================
# Remote API disclosure — QVAC Hackathon I requirement
# ------------------------------------------------------------
# This file lists EVERY remote API call Sehat makes, per the
# hackathon's transparency rules. All AI inference (completion,
# embeddings, RAG, OCR, STT, TTS) runs 100% locally on-device
# via @qvac/sdk. No cloud AI APIs are used.
# ============================================================

ai_inference_apis: []   # none — all inference is local via @qvac/sdk

remote_calls:
  - name: model-download
    purpose: One-time download of model weights before first run
    endpoint: QVAC distributed model registry (P2P) and/or HuggingFace (HTTPS)
    data_sent: model identifier only — no user data
    when: first launch / model install only; app is fully offline afterwards
    ai_service: false
    note: >
      The primary model (QVAC MedPsy-4B) is fetched from
      https://huggingface.co/qvac/MedPsy-4B-GGUF via the SDK's HTTP model source
      on first run only. All other models come from the QVAC registry. Inference
      itself never leaves the device.

  - name: p2p-delegation
    purpose: LAN/P2P transport between the phone client and the desktop node
    endpoint: Holepunch/Pears P2P stack (peer-to-peer, no central server)
    data_sent: user prompts/results between the user's OWN devices only
    when: when the phone client is used
    ai_service: false

user_data_leaving_devices: none
