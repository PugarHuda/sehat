<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .wrap{width:480px;height:480px;display:grid;place-items:center;
    background:radial-gradient(120% 120% at 30% 20%, #12b886 0%, #0b8457 55%, #086a46 100%);}
  .badge{width:300px;height:300px;border-radius:74px;background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.28); display:grid;place-items:center;position:relative;
    box-shadow:0 30px 70px rgba(0,0,0,.25), inset 0 2px 10px rgba(255,255,255,.25);}
  .s{font:800 210px/1 "Segoe UI",system-ui,sans-serif;color:#fff;letter-spacing:-6px;
    text-shadow:0 8px 24px rgba(0,0,0,.25);}
  /* medical cross dot */
  .cross{position:absolute;top:40px;right:46px;width:54px;height:54px}
  .cross::before,.cross::after{content:"";position:absolute;background:#fff;border-radius:6px;
    box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .cross::before{left:21px;top:4px;width:12px;height:46px}
  .cross::after{top:21px;left:4px;width:46px;height:12px}
</style></head>
<body><div class="wrap"><div class="badge"><div class="cross"></div><div class="s">S</div></div></div></body></html>
